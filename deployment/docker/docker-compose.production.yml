version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caseforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caseforge_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - caseforge_network
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - caseforge_network
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-caseforge}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped

  celery:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    command: celery -A caseforge worker --loglevel=info --concurrency=2
    volumes:
      - media_files:/app/media
    networks:
      - caseforge_network
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-caseforge}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped

  celery-beat:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    command: celery -A caseforge beat --loglevel=info
    volumes:
      - celery_beat:/app/celerybeat-schedule
    networks:
      - caseforge_network
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-caseforge}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - ssl_certs:/etc/ssl/certs:ro
    networks:
      - caseforge_network
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  celery_beat:
  ssl_certs:

networks:
  caseforge_network:
    driver: bridge